<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lumen — фоторедактор</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ambient"><div class="amb" id="ambA"></div><div class="amb" id="ambB"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="app">
  <header class="topbar glass">
    <button class="brand" id="samplesBtn" data-tip="Примеры и открытие фото">
      <i class="logo"></i><span class="brand-name">Lumen</span><span class="fname" id="fname"></span>
      <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 4.5 3 3 3-3"/></svg>
    </button>
    <div class="actions">
      <button class="btn" id="undo" data-tip="Отменить" data-key="Ctrl Z" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="btn" id="redo" data-tip="Повторить" data-key="Ctrl ⇧ Z" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <span class="sep"></span>
      <button class="btn" id="compare" data-tip="Удерживайте — оригинал" data-key="Пробел"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M12 4v16"/><path d="M12 4h5.5A3.5 3.5 0 0 1 21 7.5v9a3.5 3.5 0 0 1-3.5 3.5H12z" fill="currentColor" opacity=".35" stroke="none"/></svg></button>
      <button class="btn" id="histBtn" data-tip="Гистограмма" data-key="H"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 20c2-1 2.5-9 5-9s3 5 5 5 2.5-10 6-11v15"/></svg></button>
      <button class="btn hide-sm" id="resetAll" data-tip="Вернуть к оригиналу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <span class="sep hide-sm"></span>
      <button class="btn pill hide-sm" id="open" data-tip="Открыть фото" data-key="Ctrl O"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Открыть</button>
      <button class="btn primary" id="export" data-tip="Экспорт" data-key="Ctrl S">Экспорт</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="photo nt" id="photo"><canvas id="cv"></canvas><canvas id="fx"></canvas><canvas id="orig"></canvas></div>
    <div class="badge glass">Оригинал</div>
    <div class="hist glass" id="hist"><canvas id="histCv" width="432" height="160"></canvas><div class="hl"><span>Тени</span><span>Средние</span><span>Света</span></div></div>
    <div class="dropzone glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M20 15v3a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-3"/></svg>
      Отпустите, чтобы открыть фото
    </div>
  </main>

  <section class="dock glass">
    <div class="seg" id="seg">
      <span class="pill"></span>
      <button class="on" data-tab="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Настройки</button>
      <button data-tab="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="9" r="5.5"/><circle cx="12" cy="15" r="5.5"/></svg>Фильтры</button>
      <button data-tab="2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>Кадр</button>
    </div>
    <div class="panels">
      <div class="panel on" data-panel="0">
        <div class="head" id="adjHead"><span id="lbl">Экспозиция</span><b id="val">0</b><button class="mini" id="resetOne" data-tip="Сбросить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button></div>
        <div class="dial" id="dialAdj" aria-label="Значение настройки"></div>
        <div class="scroller"><button class="arr l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="hs chips" id="chips"></div><button class="arr r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
      </div>
      <div class="panel" data-panel="1">
        <div class="amt" id="amtRow"><div>
          <div class="head"><span id="amtLbl">Интенсивность</span><b id="amtVal">100</b></div>
          <div class="dial" id="dialAmt" aria-label="Интенсивность фильтра"></div>
        </div></div>
        <div class="scroller"><button class="arr l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="hs thumbs" id="thumbs"></div><button class="arr r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
      </div>
      <div class="panel" data-panel="2">
        <div class="head"><span>Выпрямление</span><b id="sval">0°</b></div>
        <div class="dial" id="dialStr" aria-label="Угол выпрямления"></div>
        <div class="crow" style="margin-top:6px">
          <button class="tool" data-act="rotL" data-tip="Повернуть на 90°"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M3 12V9a5 5 0 0 1 5-5h5"/><path d="m10 1 3 3-3 3"/></svg><span class="hide-sm">Повернуть</span></button>
          <button class="tool" data-act="flipH" data-tip="Отразить по горизонтали"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7 3 17h5z"/><path d="m16 7 5 10h-5z" fill="currentColor" fill-opacity=".35"/></svg></button>
          <button class="tool" data-act="flipV" data-tip="Отразить по вертикали"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="M7 8 17 3v5z"/><path d="m7 16 10 5v-5z" fill="currentColor" fill-opacity=".35"/></svg></button>
          <span class="vsep"></span>
          <div class="crow" id="aspects">
            <button class="tool sm on" data-aspect="orig">Исходные</button>
            <button class="tool sm" data-aspect="1:1"><i style="width:12px;height:12px"></i>1:1</button>
            <button class="tool sm" data-aspect="4:5"><i style="width:11px;height:13px"></i>4:5</button>
            <button class="tool sm" data-aspect="3:2"><i style="width:15px;height:10px"></i>3:2</button>
            <button class="tool sm" data-aspect="16:9"><i style="width:16px;height:9px"></i>16:9</button>
            <button class="tool sm" data-aspect="9:16"><i style="width:9px;height:16px"></i>9:16</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Samples popover -->
<div class="popover glass" id="samples">
  <div class="pop-title">Примеры</div>
  <div class="samples">
    <button class="sample" data-scene="day"><canvas width="264" height="176"></canvas><span>☀️ День</span></button>
    <button class="sample" data-scene="night"><canvas width="264" height="176"></canvas><span>🌙 Ночь</span></button>
  </div>
  <button class="pop-row" id="open2"><svg class="ic18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Открыть своё фото…<kbd>Ctrl O</kbd></button>
</div>

<!-- New preset -->
<div class="modal" id="presetModal">
  <div class="sheet glass small" role="dialog" aria-labelledby="presetTitle">
    <canvas class="preset-prev" id="presetPrev"></canvas>
    <h2 id="presetTitle">Новый пресет</h2>
    <p class="sub">Сохраните текущий вид, чтобы применять его к любым фото в один тап.</p>
    <div class="inp"><input id="presetName" maxlength="28" autocomplete="off" spellcheck="false"></div>
    <div class="info" id="presetInfo"></div>
    <div class="row-btns">
      <button class="btn ghost" id="presetCancel">Отмена</button>
      <button class="btn primary" id="presetSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Export -->
<div class="modal" id="exportModal">
  <div class="sheet glass export" role="dialog" aria-labelledby="exTitle">
    <button class="xbtn" id="exClose" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="ex-preview">
      <div class="ex-stage"><canvas id="exCv"></canvas></div>
      <div class="ex-meta"><span id="exDims">—</span><span id="exBytes">—</span></div>
    </div>
    <div class="ex-side">
      <h2 id="exTitle">Экспорт</h2>
      <div class="field"><label for="exName">Имя файла</label><div class="inp"><input id="exName" autocomplete="off" spellcheck="false"><em id="exExt">.jpg</em></div></div>
      <div class="field"><span>Формат</span>
        <div class="seg seg3" id="exFmt"><span class="pill"></span><button data-v="jpeg">JPEG</button><button data-v="png">PNG</button><button data-v="webp">WebP</button></div>
      </div>
      <div class="field collapse" id="exQRow"><div>
        <span style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px">Качество <b id="exQVal" style="color:var(--accent)">92%</b></span>
        <input type="range" class="range" id="exQ" min="50" max="100" value="92">
      </div></div>
      <div class="field"><span>Размер</span><div class="opts" id="exRes"></div></div>
      <div class="field"><span>Рамка</span>
        <div class="opts" id="exFrame">
          <button class="opt" data-v="none"><i class="sw"></i>Нет</button>
          <button class="opt" data-v="white"><i class="sw white"></i>Белая</button>
          <button class="opt" data-v="black"><i class="sw black"></i>Чёрная</button>
          <button class="opt" data-v="pola"><i class="sw pola"></i>Полароид</button>
        </div>
      </div>
      <div class="ex-actions">
        <button class="btn ghost" id="exCopy" data-tip="Скопировать PNG в буфер"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v7a3 3 0 0 0 3 3h2"/></svg></button>
        <button class="btn ghost" id="exShare" data-tip="Поделиться" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M5 12v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6"/></svg></button>
        <button class="btn primary" id="exSave"><span class="lbl">Сохранить</span><span class="spin"></span><svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div class="toast glass" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span id="toastTxt"></span><button id="toastAct"></button></div>
<div class="tip glass" id="tip"></div>
<input type="file" id="file" accept="image/*" hidden>

<script src="js/engine.js"></script>
<script src="js/scenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
