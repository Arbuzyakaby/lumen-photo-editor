<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lumen — фоторедактор</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --accent: #ffd60a;
  --accent-ink: #1c1500;
  --text: rgba(255, 255, 255, .96);
  --muted: rgba(235, 235, 245, .6);
  --faint: rgba(235, 235, 245, .3);
  --fill: rgba(255, 255, 255, .08);
  --fill-2: rgba(255, 255, 255, .14);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --soft-spring: cubic-bezier(.3, 1.3, .6, 1);
  --smooth: cubic-bezier(.22, 1, .36, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text);
  font: 500 14px/1.3 var(--font); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; user-select: none; }
button { font: inherit; color: inherit; letter-spacing: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, .dial:focus-visible, input:focus-visible { outline: 2px solid rgba(10, 132, 255, .9); outline-offset: 2px; }
svg { display: block; }
.ic18 { width: 18px; height: 18px; }

/* ---------- Ambient background ---------- */
.ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #050507; }
.amb { position: absolute; inset: -20%; background-size: cover; background-position: center; opacity: 0;
  filter: blur(80px) saturate(1.8) brightness(.62); transform: scale(1.1); transition: opacity 1.4s var(--smooth); }
.amb.on { opacity: 1; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .35; animation: float 26s ease-in-out infinite alternate; }
.b1 { width: 46vmax; height: 46vmax; left: -14vmax; top: -16vmax; background: #5e5ce6; }
.b2 { width: 38vmax; height: 38vmax; right: -12vmax; top: 8vmax; background: #ff375f; animation-delay: -9s; }
.b3 { width: 42vmax; height: 42vmax; left: 28vmax; bottom: -24vmax; background: #ff9f0a; animation-delay: -15s; }
@keyframes float { to { transform: translate(7vmax, 5vmax) scale(1.12); } }
.ambient::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 20%, rgba(0, 0, 0, .6)); }

/* ---------- Liquid glass ---------- */
.glass { position: relative; isolation: isolate;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04) 40%, rgba(255, 255, 255, .02)),
    rgba(28, 28, 34, .38);
  -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.06);
  backdrop-filter: blur(40px) saturate(200%) brightness(1.06);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .42),
    inset 0 -1px 0 rgba(255, 255, 255, .06),
    inset 0 0 24px rgba(255, 255, 255, .035),
    0 0 0 .5px rgba(0, 0, 0, .5),
    0 30px 80px -24px rgba(0, 0, 0, .75),
    0 4px 14px rgba(0, 0, 0, .22); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; z-index: -1; pointer-events: none;
  background: linear-gradient(155deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, .06) 28%, rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, .22) 85%, rgba(255, 255, 255, .45));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
  background: radial-gradient(320px circle at var(--mx, 50%) var(--my, -80%), rgba(255, 255, 255, .16), transparent 62%);
  opacity: 0; transition: opacity .6s var(--smooth); }
.glass:hover::after { opacity: 1; }

/* ---------- Layout ---------- */
.app { position: relative; z-index: 1; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
  padding: 12px max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }

/* ---------- Top bar ---------- */
.topbar { width: min(1120px, 100%); margin: 0 auto; height: 56px; border-radius: 28px; padding: 0 9px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; animation: dropIn 1s var(--spring) both; }
@keyframes dropIn { from { transform: translateY(-28px) scale(.97); opacity: 0; } }
.brand { height: 40px; border-radius: 20px; padding: 0 12px 0 7px; display: flex; align-items: center; gap: 10px; min-width: 0;
  transition: background .3s, transform .45s var(--spring); }
.brand:hover { background: var(--fill); }
.brand:active { transform: scale(.95); }
.logo { width: 28px; height: 28px; border-radius: 9px; flex: none; position: relative; overflow: hidden;
  background: conic-gradient(from 210deg, #ff375f, #ff9f0a, #ffd60a, #30d158, #64d2ff, #0a84ff, #bf5af2, #ff375f);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35), 0 6px 16px -4px rgba(255, 120, 80, .55); }
.logo::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: rgba(255, 255, 255, .92); box-shadow: 0 0 10px rgba(255, 255, 255, .8); }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
.fname { color: var(--muted); font-size: 13px; max-width: 26vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { width: 12px; height: 12px; color: var(--muted); transition: transform .45s var(--spring); }
.brand.open .chev { transform: rotate(180deg); }
.actions { display: flex; align-items: center; gap: 4px; }
.btn { height: 38px; min-width: 38px; border-radius: 19px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 10px;
  font-weight: 600; transition: transform .45s var(--spring), background .3s, color .3s, opacity .3s, box-shadow .3s; }
.btn svg { width: 19px; height: 19px; }
.btn:hover { background: var(--fill-2); }
.btn:active { transform: scale(.86); }
.btn:disabled { opacity: .28; pointer-events: none; }
.btn.on { background: rgba(255, 255, 255, .9); color: #111; }
.btn.pill { background: var(--fill); padding: 0 15px 0 12px; }
.btn.pill:hover { background: var(--fill-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); padding: 0 18px; margin-left: 4px;
  box-shadow: 0 8px 22px -6px rgba(255, 214, 10, .6), inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -1px 0 rgba(0, 0, 0, .12); }
.btn.primary:hover { background: #ffe03d; }
.btn.ghost { background: var(--fill); padding: 0 16px; }
.btn.ghost:hover { background: var(--fill-2); }
.sep { width: 1px; height: 22px; background: rgba(255, 255, 255, .14); margin: 0 5px; }

/* ---------- Tooltip ---------- */
.tip { position: fixed; z-index: 60; padding: 7px 11px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap;
  pointer-events: none; opacity: 0; transform: translateY(-4px) scale(.94); transition: opacity .2s, transform .35s var(--spring); }
.tip.on { opacity: 1; transform: none; }
.tip kbd { font: inherit; color: var(--muted); margin-left: 8px; }

/* ---------- Popover ---------- */
.popover { position: fixed; z-index: 40; width: 300px; border-radius: 24px; padding: 14px; transform-origin: 30px -10px;
  opacity: 0; transform: scale(.9) translateY(-8px); pointer-events: none; transition: opacity .3s var(--smooth), transform .5s var(--spring); }
.popover.open { opacity: 1; transform: none; pointer-events: auto; }
.pop-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 2px 4px 10px; }
.samples { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sample { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; transition: transform .45s var(--spring); }
.sample:hover { transform: translateY(-3px); }
.sample:active { transform: scale(.95); }
.sample canvas { width: 100%; aspect-ratio: 3 / 2; border-radius: 14px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .14), 0 10px 24px -8px rgba(0, 0, 0, .6); }
.sample span { font-size: 13px; font-weight: 600; padding-left: 2px; }
.sample small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.pop-row { width: 100%; margin-top: 12px; height: 40px; border-radius: 13px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--fill); font-weight: 600; transition: background .3s, transform .45s var(--spring); }
.pop-row:hover { background: var(--fill-2); }
.pop-row:active { transform: scale(.97); }
.pop-row kbd { margin-left: auto; font: inherit; font-size: 12px; color: var(--muted); }

/* ---------- Stage ---------- */
.stage { position: relative; min-height: 0; display: grid; place-items: center; }
.photo { position: relative; border-radius: 14px; overflow: hidden; width: 0; height: 0; touch-action: none;
  box-shadow: 0 50px 110px -30px rgba(0, 0, 0, .85), 0 0 0 .5px rgba(255, 255, 255, .12);
  transition: width .65s var(--spring), height .65s var(--spring); }
.photo.nt { transition: none; }
.photo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx { opacity: 0; transition: opacity .5s var(--smooth); pointer-events: none; }
#orig { opacity: 0; transition: opacity .3s var(--smooth); pointer-events: none; }
.photo.comparing #orig { opacity: 1; }
.photo.pop { animation: pop 1s var(--spring); }
@keyframes pop { from { transform: scale(.9); filter: blur(14px); opacity: 0; } }
.photo.bump { animation: bump .55s var(--spring); }
@keyframes bump { 45% { transform: scale(.975); } }

.badge { position: absolute; top: 10px; left: 50%; z-index: 3; border-radius: 14px; padding: 6px 14px; font-size: 11px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; opacity: 0; transform: translate(-50%, -8px) scale(.9); pointer-events: none; transition: all .45s var(--spring); }
.stage.comparing .badge { opacity: 1; transform: translate(-50%, 0); }

.hist { position: absolute; top: 8px; right: 8px; z-index: 3; border-radius: 18px; padding: 10px 12px 8px; opacity: 0; pointer-events: none;
  transform: translateY(-8px) scale(.94); transform-origin: top right; transition: opacity .35s var(--smooth), transform .5s var(--spring); }
.hist.on { opacity: 1; transform: none; }
.hist canvas { width: 216px; height: 80px; display: block; }
.hist .hl { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }

.dropzone { position: absolute; inset: 4px; z-index: 5; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  font-size: 17px; font-weight: 600; opacity: 0; transform: scale(.97); pointer-events: none; transition: all .45s var(--spring);
  outline: 2px dashed rgba(255, 255, 255, .45); outline-offset: -16px; }
.dropzone svg { width: 46px; height: 46px; animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.stage.drag .dropzone { opacity: 1; transform: none; }

/* ---------- Dock ---------- */
.dock { width: min(880px, 100%); margin: 0 auto; border-radius: 34px; padding: 10px 12px 12px; animation: riseIn 1.1s .08s var(--spring) both; }
@keyframes riseIn { from { transform: translateY(44px) scale(.96); opacity: 0; } }
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); width: min(400px, 100%); margin: 0 auto 6px; padding: 3px;
  border-radius: 15px; background: rgba(0, 0, 0, .28); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35), inset 0 -.5px 0 rgba(255, 255, 255, .08); }
.seg button { position: relative; z-index: 1; height: 32px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--muted); transition: color .3s; }
.seg button svg { width: 15px; height: 15px; }
.seg button.on { color: #fff; }
.seg .pill { position: absolute; top: 3px; left: 3px; bottom: 3px; width: calc((100% - 6px) / 3); border-radius: 12px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .13));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 4px 12px rgba(0, 0, 0, .3); transition: transform .6s var(--spring); }
.seg.press .pill { transform-origin: center; }

.panels { position: relative; height: 190px; }
.panel { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px;
  opacity: 0; transform: translateY(14px) scale(.98); filter: blur(8px); pointer-events: none;
  transition: opacity .45s var(--smooth), transform .65s var(--spring), filter .45s var(--smooth); }
.panel.on { opacity: 1; transform: none; filter: none; pointer-events: auto; }

.head { display: flex; align-items: center; justify-content: center; gap: 10px; height: 22px; }
.head span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.head b { min-width: 40px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
.head.swap span, .head.swap b { animation: swapIn .5s var(--spring); }
@keyframes swapIn { from { opacity: 0; transform: translateY(6px); } }
.mini { width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; color: var(--muted);
  opacity: 0; transform: scale(.5); pointer-events: none; transition: all .4s var(--spring); }
.mini.show { opacity: 1; transform: none; pointer-events: auto; }
.mini:hover { color: #fff; background: var(--fill-2); }
.mini:active { transform: rotate(-140deg) scale(.85); }
.mini svg { width: 14px; height: 14px; }

/* ---------- Dial (ruler scrubber) ---------- */
.dial { position: relative; width: min(560px, 100%); height: 46px; margin: 0 auto; overflow: hidden; cursor: grab; touch-action: none; border-radius: 12px;
  -webkit-mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }
.dial:active, .dial.active { cursor: grabbing; }
.dial .rail { position: absolute; top: 0; bottom: 0; left: 0; width: 602px; will-change: transform; }
.dial .rail.anim { transition: transform .55s var(--spring); }
.dial .ticks, .dial .major, .dial .fill { position: absolute; left: 0; }
.dial .ticks { right: 0; top: 17px; height: 12px; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .34) 0 1.5px, transparent 1.5px 12px); }
.dial .major { right: 0; top: 13px; height: 20px; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .7) 0 1.5px, transparent 1.5px 60px); }
.dial .fill { top: 13px; height: 20px; background: repeating-linear-gradient(90deg, var(--accent) 0 1.5px, transparent 1.5px 12px); filter: drop-shadow(0 0 4px rgba(255, 214, 10, .5)); }
.dial .zero { position: absolute; top: 6px; width: 5px; height: 5px; margin-left: -1.75px; border-radius: 50%; background: rgba(255, 255, 255, .8); }
.dial .needle { position: absolute; left: 50%; top: 7px; bottom: 7px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: #fff;
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .3), 0 0 10px rgba(255, 255, 255, .6); transition: transform .35s var(--spring); }
.dial.active .needle { transform: scaleY(1.15); }
.dial.snap .needle { animation: snap .35s var(--spring); }
@keyframes snap { 40% { transform: scale(1.6, 1.2); background: var(--accent); } }

/* ---------- Horizontal scrollers ---------- */
.scroller { position: relative; --fl: 0px; --fr: 0px; }
.scroller.can-l { --fl: 44px; }
.scroller.can-r { --fr: 44px; }
.hs { display: flex; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
  -webkit-mask: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
  mask: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent); }
.hs::-webkit-scrollbar { display: none; }
.hs.dragging { cursor: grabbing; }
.hs.dragging * { pointer-events: none; }
.arr { position: absolute; top: 50%; z-index: 2; width: 30px; height: 30px; margin-top: -24px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(70, 70, 80, .75); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 4px 14px rgba(0, 0, 0, .45);
  opacity: 0; transform: scale(.7); pointer-events: none; transition: opacity .4s var(--spring), transform .4s var(--spring), background .3s; }
.arr svg { width: 14px; height: 14px; }
.arr.l { left: 2px; } .arr.r { right: 2px; }
.arr:hover { background: rgba(95, 95, 105, .9); }
.arr:active { transform: scale(.85) !important; }
/* Visible whenever there's more to scroll to — hover just makes them pop a bit more.
   Keeping pointer-events: auto unconditionally (once shown) avoids relying on :hover
   timing for click-through, which is flaky in some browser/OS combinations. */
.scroller.can-l .arr.l, .scroller.can-r .arr.r { opacity: .5; transform: none; pointer-events: auto; }
.scroller.can-l:hover .arr.l, .scroller.can-r:hover .arr.r { opacity: 1; }
@media (hover: none) { .scroller.can-l .arr.l, .scroller.can-r .arr.r { opacity: .85; } }

/* ---------- Chips ---------- */
.chips { gap: 2px; padding: 6px 8px 2px; }
.chip { flex: 0 0 auto; width: 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted);
  transition: color .3s, transform .45s var(--spring); }
.chip:active { transform: scale(.9); }
.ring { position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
  background: var(--fill); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
  transition: background .35s, box-shadow .35s, transform .5s var(--spring); }
.ring .ic, .ring .num { grid-area: 1 / 1; transition: opacity .3s, transform .45s var(--spring); }
.ring .ic svg { width: 22px; height: 22px; }
.ring .num { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0; transform: scale(.6); color: #fff; }
.ring .arc { position: absolute; inset: -3px; width: 56px; height: 56px; transform: rotate(-90deg); pointer-events: none; }
.ring .arc.neg { transform: rotate(-90deg) scaleY(-1); }
.ring .arc circle { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 163.4; stroke-dashoffset: 163.4;
  transition: stroke-dashoffset .35s var(--smooth); }
.chip .nm { font-size: 11px; font-weight: 600; white-space: nowrap; max-width: 74px; overflow: hidden; text-overflow: ellipsis; }
.chip.on { color: #fff; }
.chip.on .ring { background: rgba(255, 255, 255, .22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 8px 20px -6px rgba(0, 0, 0, .5); transform: translateY(-2px); }
.chip.on.has .ic { opacity: 0; transform: scale(.6); }
.chip.on.has .num { opacity: 1; transform: none; }
.chip.auto .ring { background: linear-gradient(145deg, rgba(255, 214, 10, .3), rgba(255, 159, 10, .12)); box-shadow: inset 0 0 0 1px rgba(255, 214, 10, .35); color: var(--accent); }
.chip.auto:hover .ring { transform: rotate(-12deg) scale(1.05); }
.chip.auto.spark .ring { animation: spark .8s var(--spring); }
@keyframes spark { 30% { transform: scale(1.18) rotate(-20deg); box-shadow: 0 0 0 6px rgba(255, 214, 10, .15), 0 0 24px rgba(255, 214, 10, .6); } }
.csep { flex: none; width: 1px; height: 34px; margin: 8px 6px 0; background: rgba(255, 255, 255, .12); }

/* ---------- Filters ---------- */
.amt { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .5s var(--smooth), opacity .4s; }
.amt.show { grid-template-rows: 1fr; opacity: 1; }
.amt > div { overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.thumbs { gap: 10px; padding: 8px 10px 4px; align-items: flex-start; }
.thumb { position: relative; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--muted);
  transition: color .3s, transform .45s var(--spring), opacity .3s, margin .35s var(--smooth); }
.thumb:hover { transform: translateY(-3px); }
.thumb:active { transform: scale(.93); }
.thumb canvas, .tile-add { width: 76px; height: 76px; border-radius: 14px; display: block;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 8px 20px -8px rgba(0, 0, 0, .6); transition: box-shadow .35s, transform .5s var(--spring); }
.thumb span { font-size: 11px; font-weight: 600; max-width: 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.on { color: #fff; }
.thumb.on canvas { box-shadow: 0 0 0 2.5px var(--accent), 0 12px 26px -8px rgba(255, 214, 10, .5); transform: scale(1.04); }
.tile-add { display: grid; place-items: center; background: var(--fill); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .22); color: #fff; }
.tile-add svg { width: 26px; height: 26px; transition: transform .5s var(--spring); }
.thumb.add:hover .tile-add { background: var(--fill-2); }
.thumb.add:hover .tile-add svg { transform: rotate(90deg); }
.thumb .del { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: #3a3a3e; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .5), 0 4px 10px rgba(0, 0, 0, .4); color: #fff;
  opacity: 0; transform: scale(.4); transition: all .35s var(--spring); }
.thumb .del svg { width: 11px; height: 11px; }
.thumb:hover .del { opacity: 1; transform: none; }
.thumb .del:hover { background: #ff453a; }
.thumb.new canvas { animation: newTile 1.1s var(--spring); }
@keyframes newTile { 0% { transform: scale(.4); opacity: 0; } 60% { box-shadow: 0 0 0 5px rgba(255, 214, 10, .35), 0 0 30px rgba(255, 214, 10, .6); } }
.thumb.bye { animation: bye .35s var(--smooth) forwards; }
@keyframes bye { to { transform: scale(.4); opacity: 0; } }
.tsep { flex: none; align-self: center; width: 1px; height: 60px; margin: 0 4px 18px; background: rgba(255, 255, 255, .14); }

/* ---------- Crop ---------- */
.crow { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
.tool { height: 38px; padding: 0 14px; border-radius: 19px; display: flex; align-items: center; gap: 8px; background: var(--fill);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); font-size: 13px; font-weight: 600; transition: all .45s var(--spring); }
.tool svg { width: 18px; height: 18px; }
.tool:hover { background: var(--fill-2); }
.tool:active { transform: scale(.9); }
.tool.on { background: rgba(255, 255, 255, .92); color: #111; box-shadow: 0 6px 18px -6px rgba(0, 0, 0, .5); }
.tool.sm { height: 32px; padding: 0 12px; font-size: 12px; }
.tool.sm i { display: block; border: 1.5px solid currentColor; border-radius: 2.5px; opacity: .8; }
.vsep { width: 1px; height: 24px; background: rgba(255, 255, 255, .14); margin: 0 4px; }

/* ---------- Modals ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
  background: rgba(0, 0, 0, 0); visibility: hidden; transition: background .4s var(--smooth), visibility 0s linear .45s; }
.modal.open { background: rgba(0, 0, 0, .45); visibility: visible; transition: background .4s var(--smooth), visibility 0s; }
.sheet { border-radius: 30px; opacity: 0; transform: scale(.9) translateY(24px); transition: opacity .35s var(--smooth), transform .6s var(--spring);
  max-height: calc(100dvh - 32px); overflow: auto; scrollbar-width: none; }
.sheet::-webkit-scrollbar { display: none; }
.modal.open .sheet { opacity: 1; transform: none; }
.sheet h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.025em; }
.sheet .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.xbtn { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--fill); color: var(--muted); transition: all .4s var(--spring); }
.xbtn:hover { background: var(--fill-2); color: #fff; }
.xbtn:active { transform: scale(.85) rotate(90deg); }
.xbtn svg { width: 13px; height: 13px; }

.sheet.small { width: min(400px, 100%); padding: 24px; text-align: center; }
.preset-prev { width: 132px; height: 132px; margin: 4px auto 16px; border-radius: 26px; display: block; box-shadow: 0 0 0 1px rgba(255, 255, 255, .15), 0 20px 40px -14px rgba(0, 0, 0, .8); }
.inp { display: flex; align-items: center; height: 44px; border-radius: 13px; background: rgba(0, 0, 0, .28); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
  transition: box-shadow .3s; }
.inp:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px rgba(255, 214, 10, .15); }
.inp input { flex: 1; min-width: 0; height: 100%; padding: 0 14px; border: 0; outline: 0; background: none; color: #fff; font: 600 15px var(--font); letter-spacing: -.01em; user-select: text; }
.inp em { font-style: normal; color: var(--muted); padding-right: 14px; font-weight: 600; }
.sheet.small .inp { margin: 18px 0 8px; }
.info { font-size: 12px; color: var(--muted); min-height: 16px; }
.row-btns { display: flex; gap: 8px; margin-top: 18px; }
.row-btns .btn { flex: 1; height: 44px; border-radius: 22px; font-size: 15px; }

/* export sheet */
.sheet.export { position: relative; width: min(920px, 100%); padding: 22px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 26px; }
.ex-preview { position: relative; min-height: 400px; border-radius: 22px; background:
  radial-gradient(ellipse at 50% 40%, rgba(255, 255, 255, .06), transparent 70%), rgba(0, 0, 0, .3);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 28px; }
.ex-stage { flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; }
#exCv { max-width: 100%; max-height: 340px; display: block; border-radius: 3px;
  box-shadow: 0 30px 60px -18px rgba(0, 0, 0, .85), 0 0 0 .5px rgba(255, 255, 255, .15); transition: transform .6s var(--spring), opacity .3s; }
#exCv.flip { transform: scale(.94); opacity: .6; }
.ex-meta { display: flex; gap: 8px; }
.ex-meta span { padding: 6px 11px; border-radius: 10px; background: rgba(255, 255, 255, .08); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .8); }
.ex-side { display: flex; flex-direction: column; padding: 6px 4px 0 0; }
.ex-side h2 { margin-bottom: 18px; }
.field { margin-bottom: 16px; }
.field > span, .field > label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.field > span b { color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.seg.seg3 { width: 100%; margin: 0; }
.collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .45s var(--smooth), opacity .35s, margin .45s var(--smooth); }
.collapse > div { overflow: hidden; }
.collapse.shut { grid-template-rows: 0fr; opacity: 0; margin-bottom: 0; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; margin: 0; background: transparent; cursor: pointer; --p: 50%; }
.range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--p), rgba(255, 255, 255, .14) var(--p)); }
.range::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--p), rgba(255, 255, 255, .14) var(--p)); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #e6e6eb); box-shadow: 0 3px 10px rgba(0, 0, 0, .45); transition: transform .35s var(--spring); }
.range::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0, 0, 0, .45); }
.range:active::-webkit-slider-thumb { transform: scale(1.2); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.opt { min-height: 46px; border-radius: 13px; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--fill); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); font-weight: 600; font-size: 13px; transition: all .45s var(--spring); }
.opt small { font-size: 10.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; transition: color .3s; }
.opt:hover { background: var(--fill-2); }
.opt:active { transform: scale(.93); }
.opt.on { background: rgba(255, 255, 255, .93); color: #111; box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .6); }
.opt.on small { color: rgba(0, 0, 0, .5); }
.opt:disabled { opacity: .3; pointer-events: none; }
.opt .sw { width: 22px; height: 16px; border-radius: 3px; background: linear-gradient(135deg, #5d8bd6, #f0a96b); }
.sw.white { box-shadow: 0 0 0 3px #fff; } .sw.black { box-shadow: 0 0 0 3px #111, 0 0 0 4px rgba(255, 255, 255, .3); }
.sw.pola { box-shadow: 0 0 0 2px #f4f1ea; border-bottom: 5px solid #f4f1ea; height: 19px; }
.ex-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
.ex-actions .btn { height: 46px; border-radius: 23px; font-size: 15px; }
.ex-actions .btn.primary { flex: 1; margin: 0; position: relative; overflow: hidden; }
.ex-actions .btn svg { width: 18px; height: 18px; }
.btn .lbl, .btn .spin, .btn .ok { transition: opacity .3s, transform .45s var(--spring); }
.btn .spin, .btn .ok { position: absolute; left: 50%; top: 50%; margin: -11px 0 0 -11px; width: 22px; height: 22px; opacity: 0; transform: scale(.5); }
.btn .spin { border-radius: 50%; border: 2.5px solid rgba(0, 0, 0, .2); border-top-color: var(--accent-ink); }
.btn.busy { pointer-events: none; }
.btn.busy .lbl { opacity: 0; transform: scale(.8); }
.btn.busy .spin { opacity: 1; transform: none; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn.done { background: #30d158 !important; color: #fff; box-shadow: 0 8px 24px -6px rgba(48, 209, 88, .6); pointer-events: none; }
.btn.done .lbl { opacity: 0; }
.btn.done .ok { opacity: 1; transform: none; }
.btn .ok path { stroke-dasharray: 30; stroke-dashoffset: 30; }
.btn.done .ok path { animation: draw .5s .1s var(--smooth) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; top: 80px; z-index: 70; border-radius: 20px; padding: 10px 12px 10px 16px; display: flex; gap: 10px; align-items: center; font-weight: 600;
  transform: translate(-50%, -24px) scale(.9); opacity: 0; pointer-events: none; transition: all .6s var(--spring); }
.toast.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast > svg { width: 18px; height: 18px; color: #30d158; flex: none; }
.toast button { color: var(--accent); font-weight: 700; padding: 4px 8px; border-radius: 10px; }
.toast button:hover { background: var(--fill-2); }
.toast button:empty { display: none; }
.toast:not(.act) { padding-right: 18px; }

@media (max-width: 760px) {
  .fname, .hide-sm { display: none; }
  .sheet.export { grid-template-columns: 1fr; padding: 18px; }
  .ex-preview { min-height: 260px; }
  #exCv { max-height: 240px; }
  .hist { transform-origin: top center; }
}
@media (max-width: 480px) {
  .topbar { padding: 0 6px; }
  .btn { min-width: 34px; padding: 0 8px; }
  .seg button svg { display: none; }
  .chip { width: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

<body>
<div class="ambient"><div class="amb" id="ambA"></div><div class="amb" id="ambB"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="app">
  <header class="topbar glass">
    <button class="brand" id="samplesBtn" data-tip="Примеры и открытие фото">

      <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 4.5 3 3 3-3"/></svg>
    </button>
    <div class="actions">
      <button class="btn" id="undo" data-tip="Отменить" data-key="Ctrl Z" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="btn" id="redo" data-tip="Повторить" data-key="Ctrl ⇧ Z" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <span class="sep"></span>
      <button class="btn" id="compare" data-tip="Удерживайте — оригинал" data-key="Пробел"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M12 4v16"/><path d="M12 4h5.5A3.5 3.5 0 0 1 21 7.5v9a3.5 3.5 0 0 1-3.5 3.5H12z" fill="currentColor" opacity=".35" stroke="none"/></svg></button>
      <button class="btn" id="histBtn" data-tip="Гистограмма" data-key="H"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 20c2-1 2.5-9 5-9s3 5 5 5 2.5-10 6-11v15"/></svg></button>
      <button class="btn hide-sm" id="resetAll" data-tip="Вернуть к оригиналу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <span class="sep hide-sm"></span>
      <button class="btn pill hide-sm" id="open" data-tip="Открыть фото" data-key="Ctrl O"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Открыть</button>
      <button class="btn primary" id="export" data-tip="Экспорт" data-key="Ctrl S">Экспорт</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="photo nt" id="photo"><canvas id="cv"></canvas><canvas id="fx"></canvas><canvas id="orig"></canvas></div>
    <div class="badge glass">Оригинал</div>

    <div class="dropzone glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M20 15v3a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-3"/></svg>
      Отпустите, чтобы открыть фото
    </div>
  </main>

  <section class="dock glass">
    <div class="seg" id="seg">
      <span class="pill"></span>
      <button class="on" data-tab="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Настройки</button>
      <button data-tab="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="9" r="5.5"/><circle cx="12" cy="15" r="5.5"/></svg>Фильтры</button>
      <button data-tab="2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>Кадр</button>
    </div>

      <div class="panel on" data-panel="0">
        <div class="head" id="adjHead"><span id="lbl">Экспозиция</span><b id="val">0</b><button class="mini" id="resetOne" data-tip="Сбросить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button></div>
        <div class="dial" id="dialAdj" aria-label="Значение настройки"></div>
        <div class="scroller"><button class="arr l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="hs chips" id="chips"></div><button class="arr r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
      </div>
      <div class="panel" data-panel="1">
        <div class="amt" id="amtRow"><div>

        </div></div>
        <div class="scroller"><button class="arr l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="hs thumbs" id="thumbs"></div><button class="arr r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
      </div>

          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Samples popover -->

<script>
/* Lumen render engine.
 * Stage 1 (Canvas 2D): rotate / flip / straighten / crop, plus edge-clamped blur.
 * Stage 2 (WebGL): the whole color pipeline in one fragment shader.
 */
window.Engine = (() => {
  'use strict';

  const ASPECTS = { orig: null, '1:1': 1, '4:5': 4 / 5, '3:2': 3 / 2, '16:9': 16 / 9, '9:16': 9 / 16 };
  const hasFilter = 'filter' in CanvasRenderingContext2D.prototype;

  const VS = 'attribute vec2 p;varying vec2 v_uv;void main(){v_uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
  const FS = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform vec2 u_px, u_res;
uniform float u_exp,u_bri,u_hi,u_sh,u_con,u_brt,u_blk,u_sat,u_vib,u_warm,u_tint,u_hue,u_sharp,u_clar,u_fade,u_vig,u_grain,u_sepia,u_gray,u_gs;
float luma(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
vec3 tx(vec2 o){return texture2D(u_tex,v_uv+o*u_px).rgb;}
float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
void main(){
  vec3 c=tx(vec2(0.));
  if(u_sharp>0.){
    vec3 b=(tx(vec2(1.,0.))+tx(vec2(-1.,0.))+tx(vec2(0.,1.))+tx(vec2(0.,-1.)))*.25;
    c+=(c-b)*u_sharp*2.2;
  }
  if(u_clar!=0.){
    float r=max(u_res.x,u_res.y)/160.;
    vec3 b=vec3(0.);
    for(int i=0;i<12;i++){float a=float(i)*.5236;vec2 d=vec2(cos(a),sin(a));b+=tx(d*r)+tx(d*r*.45);}
    b/=24.;
    float l0=luma(c);
    c+=(l0-luma(b))*u_clar*1.6*(1.-pow(abs(l0*2.-1.),2.));
  }
  c=max(c,0.);
  c*=exp2(u_exp*1.5);
  float l=luma(c);
  c*=1.+u_bri*(.55*(1.-l)*(1.-l)-.25*l*l);
  l=luma(c);
  float hw=smoothstep(.45,1.,l), sw=1.-smoothstep(0.,.55,l);
  c+=(u_sh*sw*.42+u_hi*hw*.38)*clamp((c+.05)/(l+.05),0.,2.);
  c=u_brt>=0.?c+(1.-c)*u_brt*.3:c*(1.+u_brt*.3);
  float bp=u_blk*.12; c=(c-bp)/(1.-bp);
  c=(c-.5)*(1.+u_con*.85)+.5;
  c*=vec3(1.+u_warm*.16+u_tint*.05,1.-u_tint*.12,1.-u_warm*.16+u_tint*.05);
  if(u_hue!=0.){vec3 k=vec3(.57735);float ca=cos(u_hue);c=c*ca+cross(k,c)*sin(u_hue)+k*dot(k,c)*(1.-ca);}
  l=luma(c);
  c=mix(vec3(l),c,1.+u_sat);
  float mx=max(c.r,max(c.g,c.b)),mn=min(c.r,min(c.g,c.b));
  c=mix(vec3(l),c,1.+u_vib*(1.-clamp(mx-mn,0.,1.))*1.3);
  vec3 sp=vec3(dot(c,vec3(.393,.769,.189)),dot(c,vec3(.349,.686,.168)),dot(c,vec3(.272,.534,.131)));
  c=mix(c,sp,u_sepia);
  c=mix(c,vec3(luma(c)),u_gray);
  c=mix(c,c*.8+.11,u_fade);
  vec2 asp=vec2(u_res.x/u_res.y,1.);
  float vd=length((v_uv-.5)*asp)/length(asp*.5);
  float m=smoothstep(.3,1.05,vd);
  if(u_vig>0.) c*=1.-m*u_vig*.85; else c=mix(c,vec3(1.),m*-u_vig*.6);
  c=clamp(c,0.,1.);
  float n=hash(floor(gl_FragCoord.xy/u_gs))-.5;
  c+=n*u_grain*.3*(1.-abs(luma(c)*2.-1.)*.6);
  c+=(hash(gl_FragCoord.xy+17.)-.5)/255.;
  gl_FragColor=vec4(clamp(c,0.,1.),1.);
}`;

  const UNI = ['exp', 'bri', 'hi', 'sh', 'con', 'brt', 'blk', 'sat', 'vib', 'warm', 'tint', 'hue', 'sharp', 'clar', 'fade', 'vig', 'grain', 'sepia', 'gray', 'gs', 'px', 'res'];
  const glc = document.createElement('canvas');
  const loc = {};
  let gl = null, maxTex = 4096;

  try {
    gl = glc.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false });
    if (gl) setup();
  } catch (e) {
    console.warn('WebGL недоступен, работаю без цветокоррекции:', e);
    gl = null;
  }

  function setup() {
    const mk = (type, srcText) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, srcText); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const pr = gl.createProgram();
    gl.attachShader(pr, mk(gl.VERTEX_SHADER, VS));
    gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const ap = gl.getAttribLocation(pr, 'p');
    gl.enableVertexAttribArray(ap);
    gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
    UNI.forEach(u => (loc[u] = gl.getUniformLocation(pr, 'u_' + u)));
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.uniform1i(gl.getUniformLocation(pr, 'u_tex'), 0);
    maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  }

  // ---------- Geometry ----------
  const geo = document.createElement('canvas');
  const tmp = document.createElement('canvas');
  const pad = document.createElement('canvas');
  const ids = new WeakMap();
  let nid = 0, geoKey = '', texKey = '';
  const idOf = o => { if (!ids.has(o)) ids.set(o, ++nid); return ids.get(o); };

  function layout(img, s) {
    const sw = img.width, sh = img.height, odd = s.rot % 2 === 1;
    const iw = odd ? sh : sw, ih = odd ? sw : sh;
    let cw = iw, ch = ih;
    const r = ASPECTS[s.aspect];
    if (r) { if (iw / ih > r) cw = ih * r; else ch = iw / r; }
    return { sw, sh, iw, ih, cw, ch };
  }

  function paintGeo(ctx, img, s, L, k, W, H) {
    const a = s.straighten * Math.PI / 180, c = Math.abs(Math.cos(a)), sn = Math.abs(Math.sin(a));
    // Scale so the straightened image always covers the whole crop — no black corners.
    const fill = Math.max((L.cw * c + L.ch * sn) / L.iw, (L.cw * sn + L.ch * c) / L.ih);
    ctx.save();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingQuality = 'high';
    ctx.translate(W / 2, H / 2);
    ctx.scale(s.flipH ? -1 : 1, s.flipV ? -1 : 1);
    ctx.rotate(a + s.rot * Math.PI / 2);
    ctx.scale(k * fill, k * fill);
    ctx.drawImage(img, -L.sw / 2, -L.sh / 2);
    ctx.restore();
  }

  function buildGeo(img, s, maxDim) {
    const L = layout(img, s), k = Math.min(1, maxDim / Math.max(L.cw, L.ch));
    const W = Math.max(1, Math.round(L.cw * k)), H = Math.max(1, Math.round(L.ch * k));
    const blur = (s.blur || 0) / 100 * Math.max(W, H) / 70;
    const key = [idOf(img), s.rot, s.flipH, s.flipV, s.straighten, s.aspect, Math.round(blur * 10), maxDim].join('|');
    if (key === geoKey && geo.width === W && geo.height === H) return false;
    geoKey = key;
    geo.width = W; geo.height = H;
    const g = geo.getContext('2d');
    if (blur < 0.3) { paintGeo(g, img, s, L, k, W, H); return true; }

    // Blur without zoom and without dark edges: extend the border pixels outward first,
    // blur the padded copy, then take back exactly the original frame.
    tmp.width = W; tmp.height = H;
    paintGeo(tmp.getContext('2d'), img, s, L, k, W, H);
    const p = Math.ceil(blur * 2.5) + 2;
    pad.width = W + 2 * p; pad.height = H + 2 * p;
    const x = pad.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(tmp, p, p);
    x.drawImage(tmp, 0, 0, W, 1, p, 0, W, p);
    x.drawImage(tmp, 0, H - 1, W, 1, p, H + p, W, p);
    x.drawImage(tmp, 0, 0, 1, H, 0, p, p, H);
    x.drawImage(tmp, W - 1, 0, 1, H, W + p, p, p, H);
    x.drawImage(tmp, 0, 0, 1, 1, 0, 0, p, p);
    x.drawImage(tmp, W - 1, 0, 1, 1, W + p, 0, p, p);
    x.drawImage(tmp, 0, H - 1, 1, 1, 0, H + p, p, p);
    x.drawImage(tmp, W - 1, H - 1, 1, 1, W + p, H + p, p, p);
    if (hasFilter) {
      g.filter = `blur(${blur}px)`;
      g.drawImage(pad, -p, -p);
      g.filter = 'none';
    } else {
      const f = Math.max(2, blur / 2), sm = document.createElement('canvas');
      sm.width = Math.max(1, Math.round(pad.width / f)); sm.height = Math.max(1, Math.round(pad.height / f));
      sm.getContext('2d').drawImage(pad, 0, 0, sm.width, sm.height);
      g.imageSmoothingQuality = 'high';
      g.drawImage(sm, -p, -p, pad.width, pad.height);
    }
    return true;
  }

  const maxSize = () => Math.min(maxTex, 8192);

  /** Render `img` with effective state `s` into a 2D `target` canvas, longest side ≤ maxDim. */
  function render(target, img, s, maxDim, neutral) {
    maxDim = Math.min(maxDim, maxSize());
    const changed = buildGeo(img, neutral ? { ...s, blur: 0 } : s, maxDim);
    const W = geo.width, H = geo.height;
    if (target.width !== W || target.height !== H) { target.width = W; target.height = H; }
    const t = target.getContext('2d');
    if (neutral || !gl) { t.drawImage(geo, 0, 0); return target; }

    if (glc.width !== W || glc.height !== H) { glc.width = W; glc.height = H; }
    gl.viewport(0, 0, W, H);
    if (changed || texKey !== geoKey) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, geo);
      texKey = geoKey;
    }
    const u = (n, v) => gl.uniform1f(loc[n], v);
    u('exp', s.exposure / 100); u('bri', s.brilliance / 100); u('hi', s.highlights / 100); u('sh', s.shadows / 100);
    u('con', s.contrast / 100); u('brt', s.brightness / 100); u('blk', s.blacks / 100);
    u('sat', s.saturation / 100); u('vib', s.vibrance / 100); u('warm', s.warmth / 100); u('tint', s.tint / 100);
    u('hue', s.hue * Math.PI / 180); u('sharp', s.sharpness / 100); u('clar', s.clarity / 100);
    u('fade', s.fade / 100); u('vig', s.vignette / 100); u('grain', s.grain / 100);
    u('sepia', s.sepia / 100); u('gray', s.gray / 100);
    u('gs', Math.max(1, Math.max(W, H) / 1800));
    gl.uniform2f(loc.px, 1 / W, 1 / H);
    gl.uniform2f(loc.res, W, H);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    t.drawImage(glc, 0, 0);
    return target;
  }

  return { render, layout, maxSize, ASPECTS, webgl: !!gl };
})();
</script>
<script>
/* Procedurally painted sample photos: the same mountain lake by day and by night. */
window.Scenes = (() => {
  'use strict';
  const W = 1800, H = 1200, HZ = 780;
  const cache = {};

  function rng(seed) {
    return () => {
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function canvas() {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    return [c, c.getContext('2d')];
  }
  const ridgeY = (px, base, amp, s) => base - amp * (0.5 + 0.5 * (
    Math.sin(px * 0.0029 + s) * 0.5 + Math.sin(px * 0.0083 + s * 1.7) * 0.28 +
    Math.sin(px * 0.021 + s * 2.3) * 0.14 + Math.sin(px * 0.057 + s * 3.1) * 0.08));

  function ridge(x, base, amp, s, fill) {
    x.beginPath(); x.moveTo(0, HZ + 4);
    for (let px = 0; px <= W; px += 5) x.lineTo(px, ridgeY(px, base, amp, s));
    x.lineTo(W, HZ + 4); x.closePath();
    x.fillStyle = fill; x.fill();
  }
  function pine(x, cx, by, h, col) {
    x.fillStyle = col;
    x.fillRect(cx - h * 0.018, by - h * 0.16, h * 0.036, h * 0.18);
    for (let i = 0; i < 5; i++) {
      const yb = by - h * 0.1 - i * h * 0.165, w = h * 0.3 * (1 - i * 0.17);
      x.beginPath(); x.moveTo(cx - w, yb); x.lineTo(cx, yb - h * 0.32); x.lineTo(cx + w, yb); x.closePath(); x.fill();
    }
  }
  function treeLine(x, base, amp, s, col, r, minH, maxH) {
    for (let px = -10; px <= W + 10; px += 6 + r() * 6) pine(x, px, ridgeY(px, base, amp, s) + 4, minH + r() * (maxH - minH), col);
  }
  function mirror(x, c, alpha, blur) {
    const t = document.createElement('canvas');
    t.width = W; t.height = HZ;
    t.getContext('2d').drawImage(c, 0, 0);
    x.save();
    x.globalAlpha = alpha;
    if (blur && 'filter' in x) x.filter = `blur(${blur}px)`;
    x.translate(0, HZ * 2); x.scale(1, -1);
    x.drawImage(t, 0, 0);
    x.restore();
  }
  function glow(x, px, py, rad, rgb, a) {
    const g = x.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    x.fillStyle = g; x.fillRect(px - rad, py - rad, rad * 2, rad * 2);
  }

  function day() {
    const [c, x] = canvas(), r = rng(11);
    let g = x.createLinearGradient(0, 0, 0, HZ);
    g.addColorStop(0, '#1c68cf'); g.addColorStop(0.45, '#4f98e6'); g.addColorStop(0.82, '#a9d3f5'); g.addColorStop(1, '#dcefff');
    x.fillStyle = g; x.fillRect(0, 0, W, HZ);

    const sx = 1360, sy = 200;
    g = x.createRadialGradient(sx, sy, 0, sx, sy, 460);
    g.addColorStop(0, 'rgba(255,255,250,1)'); g.addColorStop(0.05, 'rgba(255,253,235,1)');
    g.addColorStop(0.16, 'rgba(255,244,205,.5)'); g.addColorStop(0.45, 'rgba(255,240,210,.12)'); g.addColorStop(1, 'rgba(255,240,210,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, HZ);

    const cloud = (cx, cy, s, a) => {
      x.save(); x.globalAlpha = a;
      for (let i = 0; i < 26; i++) {
        const dx = (r() - 0.5) * 300 * s, px = cx + dx, py = cy + (r() - 0.5) * 40 * s + Math.abs(dx) * 0.12;
        const rad = (34 + r() * 50) * s * (1 - Math.abs(dx) / (360 * s));
        const gg = x.createRadialGradient(px, py - rad * 0.35, rad * 0.1, px, py, rad);
        gg.addColorStop(0, 'rgba(255,255,255,.95)'); gg.addColorStop(0.4, 'rgba(250,252,255,.7)');
        gg.addColorStop(0.75, 'rgba(226,236,248,.25)'); gg.addColorStop(1, 'rgba(214,228,244,0)');
        x.fillStyle = gg; x.beginPath(); x.arc(px, py, rad, 0, Math.PI * 2); x.fill();
      }
      x.restore();
    };
    cloud(360, 190, 1.4, 0.95); cloud(860, 120, 0.85, 0.9); cloud(1560, 380, 1.1, 0.85);
    cloud(1100, 330, 0.7, 0.75); cloud(140, 420, 0.8, 0.7); cloud(640, 430, 0.55, 0.6);

    g = x.createLinearGradient(0, 330, 0, HZ);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.18, '#eef4fb'); g.addColorStop(0.32, '#a9c1dc'); g.addColorStop(1, '#7f9ec4');
    ridge(x, HZ - 50, 380, 1.3, g);
    g = x.createLinearGradient(0, HZ - 220, 0, HZ);
    g.addColorStop(0, 'rgba(225,240,252,0)'); g.addColorStop(1, 'rgba(225,240,252,.45)');
    x.fillStyle = g; x.fillRect(0, HZ - 220, W, 220);
    g = x.createLinearGradient(0, HZ - 240, 0, HZ); g.addColorStop(0, '#5b8c8a'); g.addColorStop(1, '#3d6b62');
    ridge(x, HZ - 20, 230, 4.4, g);
    g = x.createLinearGradient(0, HZ - 110, 0, HZ); g.addColorStop(0, '#2f6a3c'); g.addColorStop(1, '#224f2c');
    ridge(x, HZ + 2, 100, 7.7, g);
    treeLine(x, HZ + 2, 100, 7.7, '#1b4526', r, 18, 46);

    x.fillStyle = '#2a6aa8'; x.fillRect(0, HZ, W, H - HZ);
    mirror(x, c, 0.9, 2);
    g = x.createLinearGradient(0, HZ, 0, H);
    g.addColorStop(0, 'rgba(40,110,170,.25)'); g.addColorStop(0.5, 'rgba(20,80,140,.55)'); g.addColorStop(1, 'rgba(10,45,90,.9)');
    x.fillStyle = g; x.fillRect(0, HZ, W, H - HZ);
    for (let i = 0; i < 650; i++) {
      const t = Math.pow(r(), 1.6), y = HZ + 3 + t * (H - HZ), len = (10 + r() * 120) * (0.3 + t * 1.6);
      x.fillStyle = r() < 0.7 ? `rgba(255,255,255,${0.04 + r() * 0.1})` : `rgba(0,30,70,${0.08 + r() * 0.12})`;
      x.fillRect(r() * W - len / 2, y, len, 0.8 + t * 2.4);
    }
    for (let i = 0; i < 140; i++) {
      const y = HZ + 60 + Math.pow(r(), 0.8) * (H - HZ - 60), px = sx + (r() - 0.5) * (120 + (y - HZ) * 0.5);
      x.fillStyle = `rgba(255,252,235,${0.25 + r() * 0.5})`;
      x.fillRect(px, y, 4 + r() * 18, 1.2 + r() * 1.5);
    }

    x.beginPath(); x.moveTo(0, H - 260); x.bezierCurveTo(260, H - 250, 520, H - 120, 760, H); x.lineTo(0, H); x.closePath();
    g = x.createLinearGradient(0, H - 260, 0, H); g.addColorStop(0, '#4d7d34'); g.addColorStop(1, '#1f3c17');
    x.fillStyle = g; x.fill();
    pine(x, 70, H - 250, 520, '#12301a'); pine(x, 210, H - 215, 400, '#163a1f');
    pine(x, 330, H - 175, 300, '#1a4122'); pine(x, 440, H - 130, 210, '#1d4625');
    return c;
  }

  function night() {
    const [c, x] = canvas(), r = rng(29);
    let g = x.createLinearGradient(0, 0, 0, HZ);
    g.addColorStop(0, '#01030b'); g.addColorStop(0.4, '#060d2a'); g.addColorStop(0.8, '#122052'); g.addColorStop(1, '#25316a');
    x.fillStyle = g; x.fillRect(0, 0, W, HZ);
    glow(x, 1250, HZ, 700, '140,90,190', 0.35);

    // Milky Way
    const ax = 250, ay = -60, bx = 1650, by = 640, len = Math.hypot(bx - ax, by - ay);
    const nx = -(by - ay) / len, ny = (bx - ax) / len;
    const band = o => { const t = r(); return [ax + (bx - ax) * t + nx * o, ay + (by - ay) * t + ny * o]; };
    const gauss = () => (r() + r() + r() - 1.5) / 1.5;
    for (let i = 0; i < 140; i++) { const [px, py] = band(gauss() * 120); glow(x, px, py, 60 + r() * 150, r() < 0.5 ? '180,160,235' : '140,170,240', 0.05 + r() * 0.05); }

    const id = ++estId;
    estT = setTimeout(() => {
      const d = exportDims(ex.res), fs = frameSize(d.w, d.h, ex.frame);
      f.toBlob(b => {
        if (id !== estId || !b) return;
        const ratio = (fs.W * fs.H) / (f.width * f.height);
        $('#exBytes').textContent = '≈ ' + fmtBytes(b.size * ratio * (ex.fmt === 'png' ? 0.9 : 1));
      }, 'image/' + ex.fmt, ex.q / 100);
    }, 250);
  }
  function openExport() {
    if (!src) return;
    $('#exName').value = baseName(srcName) + '-lumen';
    ['#exSave', '#exCopy', '#exShare'].forEach(s => $(s).classList.remove('busy', 'done'));
    syncExport(); openModal('#exportModal'); renderExPreview(false);
  }
  $('#export').onclick = openExport;
  $('#exClose').onclick = closeModal;
  $('#exFmt').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; ex.fmt = b.dataset.v; syncExport(); estimate(exCv); });
  $('#exQ').addEventListener('input', e => { ex.q = +e.target.value; $('#exQVal').textContent = ex.q + '%'; e.target.style.setProperty('--p', ((ex.q - 50) / 50 * 100) + '%'); estimate(exCv); });
  $('#exQ').addEventListener('change', syncExport);
  $('#exRes').addEventListener('click', e => { const b = e.target.closest('.opt'); if (!b) return; ex.res = b.dataset.v === 'orig' ? 'orig' : +b.dataset.v; syncExport(); estimate(exCv); });
  $('#exFrame').addEventListener('click', e => { const b = e.target.closest('.opt'); if (!b || b.dataset.v === ex.frame) return; ex.frame = b.dataset.v; syncExport(); renderExPreview(true); });

  const canShare = !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob()], 'x.jpg', { type: 'image/jpeg' })] }));
  $('#exShare').hidden = !canShare;

  async function doExport(kind, btn) {
    btn.classList.add('busy');
    await new Promise(r => setTimeout(r, 40));
    try {
      const d = exportDims(ex.res);
      const out = document.createElement('canvas');
      Engine.render(out, fullImg, effective(state), d.long);
      const fin = frameify(out, ex.frame);
      const type = kind === 'copy' ? 'image/png' : 'image/' + ex.fmt;
      const blob = await new Promise((res, rej) => fin.toBlob(b => (b ? res(b) : rej(new Error('encode'))), type, ex.q / 100));
      const name = baseName($('#exName').value) + (kind === 'copy' ? '.png' : EXT[ex.fmt]);
      if (kind === 'save') {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      } else if (kind === 'copy') {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      } else {
        await navigator.share({ files: [new File([blob], name, { type })], title: name });
      }
      btn.classList.remove('busy'); btn.classList.add('done');
      const msg = kind === 'copy' ? 'Скопировано в буфер обмена' : kind === 'save' ? `Сохранено · ${fin.width}×${fin.height} · ${fmtBytes(blob.size)}` : 'Отправлено';
      setTimeout(() => { closeModal(); toast(msg); }, 950);
    } catch (err) {
      btn.classList.remove('busy');
      if (err && err.name === 'AbortError') return;
      console.error(err);
      toast(kind === 'copy' ? 'Браузер не разрешил копирование' : 'Не удалось экспортировать', null, null, true);
    } finally {
      drawNow();
    }
  }
  $('#exSave').onclick = e => doExport('save', e.currentTarget);
  $('#exCopy').onclick = e => doExport('copy', e.currentTarget);
  $('#exShare').onclick = e => doExport('share', e.currentTarget);
  $('#exName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#exSave').click(); });

  // ---------- Toast ----------
  let tt = 0;
  function toast(msg, actLabel, act, err) {
    const t = $('#toast'), b = $('#toastAct');
    $('#toastTxt').textContent = msg;
    t.querySelector('svg').style.color = err ? '#ff453a' : '';
    b.textContent = actLabel || '';
    t.classList.toggle('act', !!actLabel);
    b.onclick = () => { t.classList.remove('on'); act && act(); };
    t.classList.remove('on'); reflow(t); t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), actLabel ? 4500 : 2400);
  }

  // ---------- Tooltips ----------
  const tip = $('#tip');
  let tipT = 0;
  function hideTip() { clearTimeout(tipT); tip.classList.remove('on'); }
  function bindTip(el) {
    el.addEventListener('pointerenter', e => {
      if (e.pointerType !== 'mouse') return;
      clearTimeout(tipT);
      tipT = setTimeout(() => {
        if (el.closest('.modal:not(.open)') || pop.classList.contains('open') && el === brand) return;
        tip.innerHTML = esc(el.dataset.tip) + (el.dataset.key ? `<kbd>${esc(el.dataset.key)}</kbd>` : '');
        const r = el.getBoundingClientRect(), tw2 = tip.offsetWidth;
        const below = r.top < innerHeight / 2;
        tip.style.left = clamp(r.left + r.width / 2 - tw2 / 2, 8, innerWidth - tw2 - 8) + 'px';
        tip.style.top = (below ? r.bottom + 10 : r.top - tip.offsetHeight - 10) + 'px';
        tip.classList.add('on');
      }, 550);
    });
    el.addEventListener('pointerleave', hideTip);
    el.addEventListener('pointerdown', hideTip);
  }
  $$('[data-tip]').forEach(bindTip);

  // ---------- Keyboard ----------
  addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey, code = e.code;
    const typing = e.target.matches('input:not([type=range]), textarea');
    if (e.key === 'Escape') { closeModal(); togglePop(false); return; }
    if (activeModal) return;
    if (mod && code === 'KeyZ') { e.preventDefault(); go(e.shiftKey ? 1 : -1); }
    else if (mod && code === 'KeyY') { e.preventDefault(); go(1); }
    else if (mod && code === 'KeyO') { e.preventDefault(); $('#file').click(); }
    else if (mod && (code === 'KeyS' || code === 'KeyE')) { e.preventDefault(); openExport(); }
    else if (typing || mod) return;
    else if (code === 'Space' && !e.repeat) { e.preventDefault(); compare(true); }
    else if (code === 'KeyH') toggleHist();
    else if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3') setTab(+code.slice(-1) - 1);
  });
  addEventListener('keyup', e => { if (e.code === 'Space') compare(false); });

  // ---------- Drag & drop / paste ----------
  let dc = 0;
  addEventListener('dragenter', e => { if (![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); dc++; stage.classList.add('drag'); });
  addEventListener('dragleave', () => { if (--dc <= 0) { dc = 0; stage.classList.remove('drag'); } });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); dc = 0; stage.classList.remove('drag'); if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });
  addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])][0]; if (f) openFile(f); });

  // ---------- Glass specular follows the pointer ----------
  addEventListener('pointermove', e => {
    const g = e.target.closest && e.target.closest('.glass');
    if (!g) return;
    const r = g.getBoundingClientRect();
    g.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    g.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });

  // ---------- Boot ----------
  toggleHist(histOn);
  selectTool('exposure', false);
  loadScene('day');
  if (!Engine.webgl) setTimeout(() => toast('WebGL недоступен — цветокоррекция отключена', null, null, true), 800);
})();
</script>
</body>
